# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle performs certificate pinning for Mojang/Minecraft hosts (ex: https://libraries.minecraft.net/).
# When upstream certificates rotate, builds can fail with:
#   "Failed to validate certificate ... re-run with -Dnet.minecraftforge.gradle.check.certs=false"
# This project prefers a reliable dev/build experience; disable the pin check by default.
systemProp.net.minecraftforge.gradle.check.certs=false

# Minecraft and Forge versions
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings
mapping_channel=official
mapping_version=1.20.1

# AE2 version
ae2_version=15.2.1
ae2_version_range=[15.0.0,)

# Mod properties
mod_id=ae2web
mod_name=AE2 Web Terminal
mod_license=MIT
mod_version=1.27.0
mod_group_id=com.kokoda.ae2web
mod_authors=Kokoda
mod_description=Access your AE2 ME network through a web browser. Place the Web Terminal block, connect it to your ME network, and browse inventory, search items, and submit crafting requests from any device!
