import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.github.node-gradle.node' version '7.1.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

node {
    download = true
    version = '24.12.0'
    npmInstallCommand = 'ci'
    nodeProjectDir = file("${project.projectDir}/webui")
    workDir = file("${project.projectDir}/.gradle/nodejs")
    npmWorkDir = file("${project.projectDir}/.gradle/npm")
}

tasks.register('webuiBuild', NpmTask) {
    dependsOn(tasks.named('npmInstall'))
    workingDir = file("${project.projectDir}/webui")
    args = ['run', 'build']

    inputs.file(file("${project.projectDir}/webui/package.json"))
    inputs.file(file("${project.projectDir}/webui/package-lock.json"))
    inputs.dir(file("${project.projectDir}/webui/src"))
    inputs.dir(file("${project.projectDir}/webui/static"))
    outputs.dir(file("${project.projectDir}/webui/build"))
}

tasks.register('webuiTest', NpmTask) {
    dependsOn(tasks.named('npmInstall'))
    workingDir = file("${project.projectDir}/webui")
    args = ['run', 'test']
}

repositories {
    // 国内镜像加速
    maven {
        name = "AliYunPublic"
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        name = "AliYunGoogle"
        url = "https://maven.aliyun.com/repository/google"
    }
    maven {
        name = "TencentCloud"
        url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/"
    }
    // Mod 仓库
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    mavenCentral()
}

// Netty HTTP version - must be compatible with Forge's Netty
def nettyHttpVersion = '4.1.82.Final'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // AE2 dependency
    compileOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}:api")
    runtimeOnly fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    testImplementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}:api")

    // Gson for JSON handling
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Netty HTTP codec for web server - use jarJar to embed in mod
    // MUST use exact same version as Minecraft (4.1.82.Final) to avoid class incompatibility
    implementation "io.netty:netty-codec-http:${nettyHttpVersion}"
    jarJar(group: 'io.netty', name: 'netty-codec-http', version: "[${nettyHttpVersion}]")

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.awaitility:awaitility:4.2.0'
}

// Configure jarJar task
jarJar.enable()

tasks.named('processResources', ProcessResources).configure {
    dependsOn(tasks.named('webuiBuild'))
    exclude('web/**')
    from("${project.projectDir}/webui/build") {
        into 'web'
    }

    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
            ae2_version_range   : ae2_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

// Make sure jarJar is also reobfuscated
tasks.named('jarJar', net.minecraftforge.gradle.userdev.tasks.JarJar).configure {
    finalizedBy 'reobfJarJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test').configure {
    useJUnitPlatform()
    def tmpDir = new File(projectDir, '.tmp')
    systemProperty 'java.io.tmpdir', tmpDir.absolutePath
    systemProperty 'ae2web.prerender.storageRoot', new File(tmpDir, 'test-prerender').absolutePath
    systemProperty 'ae2web.inventoryConfig.storageRoot', new File(tmpDir, 'inventory-config').absolutePath
    systemProperty 'ae2web.players.storageRoot', new File(tmpDir, 'players').absolutePath
}

tasks.named('check').configure {
    dependsOn(tasks.named('webuiTest'))
}

tasks.named('clean').configure {
    delete file('.tmp')
}
