<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE2 Web Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <span class="logo-icon">⚡</span>
                    AE2 Web Terminal
                </h1>
                <div class="status-bar">
                    <span id="connection-status" class="status disconnected">
                        <span class="status-dot"></span>
                        <span class="status-text">Connecting...</span>
                    </span>
                    <span id="terminal-count" class="terminal-count">0 Terminals</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Search items...">
                    <button id="search-btn" class="search-btn">🔍</button>
                </div>
                
                <div class="terminals-panel">
                    <h3>Connected Terminals</h3>
                    <ul id="terminal-list" class="terminal-list">
                        <!-- Terminals will be populated here -->
                    </ul>
                </div>
            </aside>

            <section class="inventory-section">
                <div class="inventory-header">
                    <h2>Network Inventory</h2>
                    <div class="inventory-stats">
                        <span id="item-count">0 items</span>
                        <span id="total-items">0 total</span>
                    </div>
                </div>

                <div id="inventory-grid" class="inventory-grid">
                    <!-- Items will be populated here -->
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading inventory...</p>
                    </div>
                </div>

                <div class="pagination">
                    <button id="prev-page" class="page-btn" disabled>← Previous</button>
                    <span id="page-info" class="page-info">Page 1 of 1</span>
                    <button id="next-page" class="page-btn" disabled>Next →</button>
                </div>
            </section>
        </main>

        <!-- Craft Modal -->
        <div id="craft-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Request Crafting</h3>
                    <button class="modal-close" onclick="closeCraftModal()">×</button>
                </div>
                <div class="modal-body">
                    <div id="craft-item-info" class="craft-item-info">
                        <span id="craft-item-name" class="item-name"></span>
                        <span id="craft-item-id" class="item-id"></span>
                    </div>
                    <div class="form-group">
                        <label for="craft-amount">Amount to craft:</label>
                        <input type="number" id="craft-amount" value="1" min="1" max="9999">
                    </div>
                    <div class="quick-amounts">
                        <button onclick="setCraftAmount(1)">1</button>
                        <button onclick="setCraftAmount(16)">16</button>
                        <button onclick="setCraftAmount(64)">64</button>
                        <button onclick="setCraftAmount(256)">256</button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="closeCraftModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="submitCraft()">Start Crafting</button>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
